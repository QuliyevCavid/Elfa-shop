<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELFA — Administrator paneli</title><style>
:root{--bg:#f6f1eb;--card:#fffaf5;--text:#241f1b;--muted:#7b7067;--accent:#6f3f2b;--border:#e7ddd3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--text)}header{background:var(--card);border-bottom:1px solid var(--border);padding:18px 5%}.logo{font-size:24px;letter-spacing:6px;font-weight:900;text-decoration:none;color:inherit}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:18px}.muted{color:var(--muted);line-height:1.5}h1{margin:0 0 8px}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font:inherit}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;background:var(--accent);color:white}.btn.reject{background:#8d2d25}.btn.alt{background:#e7ddd3;color:var(--text)}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}.ok{display:block;background:#e6f4e8;color:#24572c}.err{display:block;background:#fde9e6;color:#8b2920}.seller{border:1px solid var(--border);background:white;border-radius:14px;padding:16px;margin-top:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:6px 10px;border-radius:20px;background:#f0e4c7;font-size:12px;font-weight:800}.pending{background:#f0e4c7}.approved{background:#d9efdc}.rejected{background:#fde0dc}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats span{background:white;border:1px solid var(--border);border-radius:10px;padding:12px}
</style></head><body><header><a href="/" class="logo">ELFA</a></header><main class="wrap">
<section id="loginPanel" class="panel"><h1>Administrator girişi</h1><p class="muted">Bu paneldən satıcı müraciətlərini yoxlayıb təsdiqləyə və ya rədd edə bilərsən.</p><form id="loginForm"><label>Administrator e-poçtu</label><input id="email" type="email" required autocomplete="username"><label>Şifrə</label><input id="password" type="password" required autocomplete="current-password"><button class="btn" style="margin-top:16px">Daxil ol</button></form><div id="msg" class="msg"></div></section>
<section id="adminPanel" class="panel" hidden><div class="top"><div><h1>Satıcıların idarə edilməsi</h1><p class="muted">Təsdiq verdiyin mağazalar marketplace-də aktivləşəcək.</p></div><button id="logout" class="btn alt">Çıxış</button></div><div class="stats" id="stats"></div><div id="list"></div></section><p><a href="/">← Müştəri saytına qayıt</a></p></main>
<script>
const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Sorğu uğursuz oldu.');return d}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function statusName(s){return s==='approved'?'Təsdiqlənib':s==='rejected'?'Rədd edilib':'Gözləyir'}
function message(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}
async function loadSellers(){const all=await api('/api/admin/sellers');const pending=all.filter(x=>x.status==='pending').length,approved=all.filter(x=>x.status==='approved').length;
$('stats').innerHTML=`<span><b>${all.length}</b> satıcı</span><span><b>${pending}</b> gözləyən müraciət</span><span><b>${approved}</b> aktiv mağaza</span>`;
$('list').innerHTML=all.length?all.map(s=>`<article class="seller"><div class="top"><div><h3 style="margin:0 0 6px">${esc(s.store_name)}</h3><div class="muted">${esc(s.full_name)} · ${esc(s.email)} · ${esc(s.phone)}</div><div class="muted">Müraciət tarixi: ${new Date(s.created_at).toLocaleString('az-AZ')}</div></div><span class="pill ${s.status}">${statusName(s.status)}</span></div><div class="actions" style="margin-top:14px">${s.status!=='approved'?`<button class="btn" data-decision="approved" data-id="${s.id}">Təsdiqlə</button>`:''}${s.status!=='rejected'?`<button class="btn reject" data-decision="rejected" data-id="${s.id}">Rədd et</button>`:''}</div></article>`).join(''):'<p class="muted">Hələ satıcı qeydiyyatı yoxdur.</p>';
document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{const action=b.dataset.decision==='approved'?'təsdiqləmək':'rədd etmək';if(!confirm('Bu satıcı müraciətini '+action+' istəyirsən?'))return;try{await api('/api/admin/sellers/'+b.dataset.id+'/decision',{method:'PATCH',body:JSON.stringify({status:b.dataset.decision})});await loadSellers()}catch(e){alert(e.message)}})}
async function showAdmin(){try{const d=await api('/api/auth/me');if(d.user.role!=='admin')throw new Error('Bu hesab administrator deyil.');$('loginPanel').hidden=true;$('adminPanel').hidden=false;await loadSellers()}catch(e){$('loginPanel').hidden=false}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});if(d.user.role!=='admin'){await api('/api/auth/logout',{method:'POST'});throw new Error('Bu hesab administrator deyil.')} $('loginPanel').hidden=true;$('adminPanel').hidden=false;await loadSellers()}catch(e){message(e.message)}};
$('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};
showAdmin();
</script></body></html>
