<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELFA — Satıcı qeydiyyatı</title><style>
:root{--bg:#f6f1eb;--card:#fffaf5;--text:#241f1b;--muted:#7b7067;--accent:#6f3f2b;--border:#e7ddd3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--text);min-height:100vh;display:grid;place-items:center;padding:22px}
.card{width:min(100%,520px);background:var(--card);border:1px solid var(--border);border-radius:22px;padding:30px;box-shadow:0 18px 55px #241f1b12}
.logo{font-size:28px;letter-spacing:7px;font-weight:900;margin-bottom:8px}.muted{color:var(--muted);line-height:1.55}h1{font-size:25px;margin:20px 0 8px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:11px;background:#fff;font:inherit;outline-color:var(--accent)}
button,.btn{display:block;width:100%;border:0;border-radius:11px;padding:14px;margin-top:18px;background:var(--accent);color:white;font-weight:700;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
a{color:var(--accent);font-weight:700}.msg{margin-top:14px;padding:12px;border-radius:10px;display:none;line-height:1.5}.ok{display:block;background:#e6f4e8;color:#24572c}.err{display:block;background:#fde9e6;color:#8b2920}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.row{grid-template-columns:1fr}.card{padding:22px}}
</style></head><body><main class="card">
<a href="/" style="text-decoration:none;color:inherit"><div class="logo">ELFA</div></a>
<div class="muted">Öz mağazanı yarat, məhsullarını ELFA marketplace-də təqdim et.</div>
<h1>Satıcı qeydiyyatı</h1>
<p class="muted">Məlumatların göndərildikdən sonra administrator yoxlayacaq. Təsdiq gələnədək mağazan müştərilərə görünməyəcək.</p>
<form id="form">
<div class="row"><div><label for="full_name">Ad və soyad</label><input id="full_name" required minlength="2" autocomplete="name"></div>
<div><label for="store_name">Mağaza adı</label><input id="store_name" required minlength="2" autocomplete="organization"></div></div>
<label for="phone">Telefon</label><input id="phone" required autocomplete="tel" placeholder="+994 50 123 45 67">
<label for="email">E-poçt</label><input id="email" type="email" required autocomplete="email">
<label for="password">Şifrə (ən azı 8 simvol)</label><input id="password" type="password" required minlength="8" autocomplete="new-password">
<button type="submit">Qeydiyyat göndər</button></form>
<div id="msg" class="msg" role="status"></div>
<p class="muted">Artıq hesabın var? <a href="/seller.html">Satıcı panelinə daxil ol</a></p>
<p class="muted"><a href="/">← ELFA ana səhifəsinə qayıt</a></p>
<script>
const form=document.getElementById('form'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';msg.textContent='';
const body={full_name:full_name.value.trim(),store_name:store_name.value.trim(),phone:phone.value.trim(),email:email.value.trim(),password:password.value};
try{const r=await fetch('/api/auth/register-seller',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();
if(!r.ok)throw new Error(d.detail||'Qeydiyyat alınmadı.');
msg.className='msg ok';msg.textContent=d.message+' İndi satıcı panelinə daxil olub statusu yoxlaya bilərsən.';form.reset();
}catch(err){msg.className='msg err';msg.textContent=err.message||'Serverə qoşulmaq mümkün olmadı.';}});
</script></main></body></html>
