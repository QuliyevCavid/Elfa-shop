<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELFA — Satıcı paneli</title><style>
:root{--bg:#f6f1eb;--card:#fffaf5;--text:#241f1b;--muted:#7b7067;--accent:#6f3f2b;--border:#e7ddd3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--text)}header{background:var(--card);border-bottom:1px solid var(--border);padding:18px 5%}.logo{font-size:24px;letter-spacing:6px;font-weight:900;text-decoration:none;color:inherit}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:18px}.muted{color:var(--muted);line-height:1.5}h1{margin:0 0 8px}h2{font-size:20px}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:white;font:inherit}textarea{min-height:75px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;margin-top:12px}.btn.alt{background:#e7ddd3;color:var(--text)}.msg{padding:12px;border-radius:10px;margin-top:12px;display:none}.ok{display:block;background:#e6f4e8;color:#24572c}.err{display:block;background:#fde9e6;color:#8b2920}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#f0e4c7;font-size:12px;font-weight:700}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.product{border:1px solid var(--border);border-radius:12px;padding:14px;background:white}.product img{width:100%;height:130px;object-fit:contain}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:18px}}
</style></head><body><header><a href="/" class="logo">ELFA</a></header><main class="wrap">
<section id="loginPanel" class="panel"><h1>Satıcı panelinə giriş</h1><p class="muted">Mağazanı idarə etmək üçün hesabına daxil ol.</p>
<form id="loginForm"><label>E-poçt</label><input id="email" type="email" required autocomplete="username"><label>Şifrə</label><input id="password" type="password" required autocomplete="current-password"><button class="btn">Daxil ol</button></form>
<p class="muted">Hesabın yoxdur? <a href="/seller-register.html">Satıcı kimi qeydiyyatdan keç</a></p><div id="loginMsg" class="msg"></div></section>
<section id="statusPanel" class="panel" hidden><div class="top"><div><h1 id="welcome">Satıcı paneli</h1><p class="muted" id="storeLine"></p></div><button class="btn alt" id="logout">Çıxış</button></div><div id="statusBox"></div></section>
<section id="productPanel" class="panel" hidden><h2>Yeni məhsul əlavə et</h2><p class="muted">Yalnız sənin mağazana aid məhsullar idarə oluna bilər.</p>
<form id="productForm"><div class="grid"><div><label>Məhsul adı</label><input id="pname" required minlength="2" maxlength="140"></div><div><label>Kateqoriya</label><input id="pcat" placeholder="Məsələn: Ətir"></div><div><label>Qiymət (AZN)</label><input id="pprice" type="number" min="0" step="0.01" required></div><div><label>Stok sayı</label><input id="pstock" type="number" min="0" step="1" required></div></div><label>Təsvir</label><textarea id="pdesc" maxlength="3000"></textarea><label>Məhsul şəkli URL-i (istəyə bağlı)</label><input id="pimage" type="url" placeholder="https://..."><button class="btn">Məhsulu əlavə et</button></form><div id="productMsg" class="msg"></div></section>
<section id="myProductsPanel" class="panel" hidden><div class="top"><h2>Məhsullarım</h2><span class="muted" id="count"></span></div><div id="myProducts" class="products"></div></section>
<p><a href="/">← Müştəri saytına qayıt</a></p></main>
<script>
const $=id=>document.getElementById(id);let me=null;
function message(el,text,ok=false){el.className='msg '+(ok?'ok':'err');el.textContent=text}
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Sorğu uğursuz oldu.');return d}
function money(n){return Number(n).toFixed(2)+' AZN'}
async function boot(){try{const d=await api('/api/auth/me');me=d.user;showPanel();}catch(e){$('loginPanel').hidden=false}}
function showPanel(){ $('loginPanel').hidden=true;$('statusPanel').hidden=false;$('welcome').textContent='Salam, '+me.full_name;$('storeLine').textContent=me.store_name+' · '+me.email;
const box=$('statusBox');$('productPanel').hidden=true;$('myProductsPanel').hidden=true;
if(me.status==='pending'){box.innerHTML='<span class="status">TƏSDİQ GÖZLƏYİR</span><h2>Mağazan yoxlanılır</h2><p class="muted">Qeydiyyatın qəbul olunub. Administrator təsdiqləyənədək məhsul əlavə etmək və mağazanı aktivləşdirmək mümkün deyil.</p>';}
else if(me.status==='rejected'){box.innerHTML='<span class="status">MÜRACİƏT RƏDD EDİLİB</span><p class="muted">Mağazan aktivləşdirilməyib. Əlavə məlumat üçün ELFA administratoru ilə əlaqə saxla.</p>';}
else if(me.role==='admin'){box.innerHTML='<p>Bu hesab administrator hesabıdır. <a href="/admin.html">Administrator panelini aç</a></p>';}
else {box.innerHTML='<span class="status" style="background:#d9efdc">MAĞAZA AKTİVDİR</span><p class="muted">Məhsullarını əlavə edə və stokunu idarə edə bilərsən.</p>';$('productPanel').hidden=false;$('myProductsPanel').hidden=false;loadProducts();}}
async function loadProducts(){try{const items=await api('/api/seller/products');$('count').textContent=items.length+' məhsul';$('myProducts').innerHTML=items.length?items.map(p=>`<div class="product">${p.image_url?`<img src="${p.image_url.replace(/"/g,'&quot;')}" alt="">`:''}<b>${esc(p.name)}</b><p class="muted">${esc(p.category||'Kateqoriya göstərilməyib')}</p><p>${money(p.price)} · Stok: ${p.stock}</p><p class="muted">${esc(p.description||'')}</p><button class="btn alt" data-delete="${p.id}">Sil</button></div>`).join(''):'<p class="muted">Hələ məhsul əlavə etməmisən.</p>';
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Bu məhsulu silmək istəyirsən?'))return;try{await api('/api/seller/products/'+b.dataset.delete,{method:'DELETE'});loadProducts()}catch(e){alert(e.message)}})
}catch(e){$('myProducts').textContent=e.message}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});me=d.user;showPanel()}catch(err){message($('loginMsg'),err.message)}};
$('productForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/seller/products',{method:'POST',body:JSON.stringify({name:$('pname').value,category:$('pcat').value,price:Number($('pprice').value),stock:Number($('pstock').value),description:$('pdesc').value,image_url:$('pimage').value})});message($('productMsg'),'Məhsul əlavə edildi.',true);$('productForm').reset();loadProducts()}catch(err){message($('productMsg'),err.message)}};
$('logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}finally{me=null;$('statusPanel').hidden=true;$('loginPanel').hidden=false}};
boot();
</script></body></html>
